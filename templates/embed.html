<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureScan Pro - Embeddable Widget</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { background: transparent; min-height: auto; }
    </style>
</head>
<body>
    <div class="embed-container">
        <div class="scanner-card">
            <h2 class="scanner-title" style="font-size:20px;">Website Security Check</h2>
            <p class="scanner-subtitle" style="font-size:13px;">Enter URL for instant security analysis</p>

            <div class="scan-form">
                <input type="text" class="url-input" id="urlInput" placeholder="https://example.com" style="padding:12px 16px;font-size:14px;">
                <button class="btn-scan" id="scanBtn" onclick="startEmbedScan()" style="padding:12px 20px;font-size:14px;">
                    &#x1f50d; Scan
                </button>
            </div>

            <div class="progress-section" id="progressSection">
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar" style="width:0%"></div>
                </div>
                <div class="progress-info">
                    <span id="progressModule" class="scanning-pulse">Starting...</span>
                    <span id="progressPercent">0%</span>
                </div>
            </div>

            <div id="embedResults" style="display:none;margin-top:20px;"></div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let scanId = null;
        let poll = null;

        document.getElementById('urlInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') startEmbedScan();
        });

        async function startEmbedScan() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) return;

            document.getElementById('scanBtn').disabled = true;
            document.getElementById('progressSection').classList.add('active');
            document.getElementById('embedResults').style.display = 'none';

            const resp = await fetch(`${API_BASE}/api/scan`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({url, scan_types: ['ssl', 'headers', 'tech']}),
            });
            const data = await resp.json();
            scanId = data.scan_id;

            poll = setInterval(async () => {
                const r = await fetch(`${API_BASE}/api/scan/${scanId}`);
                const d = await r.json();
                document.getElementById('progressBar').style.width = d.progress + '%';
                document.getElementById('progressPercent').textContent = d.progress + '%';
                if (d.current_module) document.getElementById('progressModule').textContent = d.current_module;

                if (d.status === 'completed') {
                    clearInterval(poll);
                    document.getElementById('progressSection').classList.remove('active');
                    document.getElementById('scanBtn').disabled = false;
                    renderEmbedResults(d);
                }
            }, 1000);
        }

        function renderEmbedResults(data) {
            const div = document.getElementById('embedResults');
            div.style.display = 'block';
            const s = data.summary;
            const sev = s.by_severity || {};

            let issuesHtml = '';
            const issues = (data.all_issues || []).slice(0, 5);
            for (const i of issues) {
                issuesHtml += `<div style="padding:8px 12px;background:var(--bg-input);border-radius:6px;margin-bottom:6px;font-size:12px;border-left:3px solid ${
                    i.severity === 'critical' ? 'var(--critical)' : i.severity === 'high' ? 'var(--danger)' : i.severity === 'medium' ? 'var(--warning)' : 'var(--info)'
                };">
                    <strong style="text-transform:uppercase;font-size:10px;color:${
                        i.severity === 'critical' ? 'var(--critical)' : i.severity === 'high' ? 'var(--danger)' : i.severity === 'medium' ? 'var(--warning)' : 'var(--info)'
                    };">${i.severity}</strong>
                    <span style="color:var(--text-primary);margin-left:8px;">${i.title}</span>
                </div>`;
            }

            div.innerHTML = `
                <div style="text-align:center;margin-bottom:16px;">
                    <div style="font-size:48px;font-weight:800;color:${
                        s.grade === 'A' ? 'var(--success)' : s.grade === 'B' ? '#22d3ee' : s.grade === 'C' ? 'var(--warning)' : 'var(--danger)'
                    };">${s.grade}</div>
                    <div style="font-size:12px;color:var(--text-muted);text-transform:uppercase;">Security Grade</div>
                    <div style="display:flex;justify-content:center;gap:16px;margin-top:8px;font-size:12px;">
                        <span style="color:var(--critical);">${sev.critical || 0} Critical</span>
                        <span style="color:var(--danger);">${sev.high || 0} High</span>
                        <span style="color:var(--warning);">${sev.medium || 0} Medium</span>
                        <span style="color:var(--info);">${sev.low || 0} Low</span>
                    </div>
                </div>
                ${issuesHtml}
                ${data.all_issues.length > 5 ? `<div style="text-align:center;font-size:12px;color:var(--text-muted);margin-top:8px;">+ ${data.all_issues.length - 5} more issues</div>` : ''}
                <a href="${API_BASE}/report/${scanId}" target="_blank" style="display:block;text-align:center;margin-top:12px;color:var(--accent);font-size:13px;">View Full Report &rarr;</a>
            `;
        }
    </script>
</body>
</html>
