app = "security-scanner-kuaqjqeo"
primary_region = "iad"

[build]

[env]
  DB_PATH = "/data/securescan.db"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "securescan_data"
  destination = "/data"
